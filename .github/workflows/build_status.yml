name: Build and Test

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 21

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # Spotless ratchets from origin/master-2.0-1.21.1-neo, so that branch must be present.
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'microsoft'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew clean check build --stacktrace

      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/libs/*.jar

      - name: Upload test reports and game test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            build/reports/tests/
            build/gametest/logs/
            build/companion-gametest/logs/
          if-no-files-found: ignore

  gui-smoke:
    name: Client GUI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6

      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      # Run the companion before the library smoke, which injects test sources into main output.
      - name: Verify client crash watchdog
        run: python3 -m unittest discover -s scripts -p test_ci_client_smoke.py

      - name: Companion GUI smoke test
        timeout-minutes: 20
        run: python3 scripts/ci_client_smoke.py build/companion-client-smoke xvfb-run -a ./gradlew --no-daemon runCompanionClientSmoke

      - name: GUI smoke test with JEI
        timeout-minutes: 20
        run: python3 scripts/ci_client_smoke.py build/gui-smoke xvfb-run -a ./gradlew --no-daemon runClient -I scripts/gui-smoke.init.gradle

      - name: GUI smoke test without JEI
        timeout-minutes: 20
        run: python3 scripts/ci_client_smoke.py build/gui-smoke-without-jei xvfb-run -a ./gradlew --no-daemon runClient -PwithoutJei -I scripts/gui-smoke.init.gradle

      - name: Upload client logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-smoke-logs
          path: |
            build/companion-client-smoke/logs/
            build/companion-client-smoke/crash-reports/
            build/companion-client-smoke/screenshots/
            build/gui-smoke/logs/
            build/gui-smoke/crash-reports/
            build/gui-smoke/screenshots/
            build/gui-smoke-without-jei/logs/
            build/gui-smoke-without-jei/crash-reports/
            build/gui-smoke-without-jei/screenshots/
          if-no-files-found: ignore
