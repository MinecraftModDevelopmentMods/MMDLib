name: Upload Release Artifacts

on:
  push:
    tags: [ '*' ]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel a release halfway through uploading.

env:
  JAVA_VERSION: 21
  # Only booleans here, the secrets themselves are passed to the steps that need them. This is a preventative measure.
  HAS_MAVEN: ${{ secrets.MAVEN_UPLOAD_URL != '' }}
  HAS_CURSEFORGE: ${{ secrets.CURSEFORGE_TOKEN != '' }}
  # The release tag ("modMajor.modMinor.modBug.minecraftVersionNoDots.loader" example: 1.2.1.121012) is used as-is for the mod version, build.gradle reads this.
  TAG: ${{ github.ref_name }}

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Required for mc-publish to create a GitHub release.

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'microsoft'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read gradle.properties
        run: |
          # Keep the CurseForge ID and archive name defined in gradle.properties.
          prop() { grep -E "^$1\s*=" gradle.properties | cut -d= -f2- | tr -d '[:space:]'; }
          echo "CURSEFORGE_ID=$(prop curseforge_id)" >> "$GITHUB_ENV"
          echo "MOD_ARCHIVE_NAME=$(prop mod_archive_name)" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew clean check build

      - name: Publish to Maven
        if: env.HAS_MAVEN == 'true'
        run: ./gradlew publish
        env:
          MAVEN_UPLOAD_URL: ${{ secrets.MAVEN_UPLOAD_URL }}
          MAVEN_UPLOAD_USERNAME: ${{ secrets.MAVEN_UPLOAD_USERNAME }}
          MAVEN_UPLOAD_PASSWORD: ${{ secrets.MAVEN_UPLOAD_PASSWORD }}

      # For additional properties and values that are not detected/set up here, you can read up on the docs here:
      # https://github.com/Kira-NT/mc-publish
      # I HEAVILY advise you read about this action, as this action can do a lot but also has a few quirks like changelog publishing not working right.
      - name: Publish to GitHub
        uses: Kira-NT/mc-publish@v3.3.2
        with:
          github-token: ${{ github.token }}
          version: ${{ env.TAG }}
          # Exact release filenames exclude companion jars and stale versions.
          files: |
            build/libs/${{ env.MOD_ARCHIVE_NAME }}-${{ env.TAG }}.jar
            build/libs/${{ env.MOD_ARCHIVE_NAME }}-${{ env.TAG }}-sources.jar
            build/libs/${{ env.MOD_ARCHIVE_NAME }}-${{ env.TAG }}-javadoc.jar

      - name: Publish to CurseForge
        if: env.HAS_CURSEFORGE == 'true' && env.CURSEFORGE_ID != ''
        uses: Kira-NT/mc-publish@v3.3.2
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          # Read from curseforge_id in gradle.properties.
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          version: ${{ env.TAG }}
          files: |
            build/libs/${{ env.MOD_ARCHIVE_NAME }}-${{ env.TAG }}.jar
            build/libs/${{ env.MOD_ARCHIVE_NAME }}-${{ env.TAG }}-sources.jar
            build/libs/${{ env.MOD_ARCHIVE_NAME }}-${{ env.TAG }}-javadoc.jar
          loaders: |
            neoforge
          environment: client | server
          java: ${{ env.JAVA_VERSION }}
