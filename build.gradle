    transitive = false
  }

  compileOnly fg.deobf("slimeknights:TConstruct:${mc_version}.2-${tconstruct_version}") {
    transitive = false
  }

  compileOnly fg.deobf("curse.maven:constructs-armory-287683:${conarm_curse_file}")

