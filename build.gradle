import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import groovy.json.JsonSlurper
import java.util.regex.Matcher
import net.minecraftforge.gradle.common.tasks.SignJar

java {
  toolchain.languageVersion = JavaLanguageVersion.of(8)
}

jacoco {
  toolVersion = '0.8.12'
}

tasks.register('junitPlatformJacocoReport', JacocoReport) {
  dependsOn test
  executionData test
  sourceDirectories.from files('./src/main')
  classDirectories.from sourceSets.main.output
}

spotbugs {
  ignoreFailures = true
  effort = Effort.valueOf('MAX')
  reportLevel = Confidence.valueOf('LOW')
  //includeFilter = file("$rootProject.projectDir/config/spotbugs-filter.xml")
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
  reports {
    xml.required = false
    html.required = true
  }
}

checkstyle {
  ignoreFailures = true
  toolVersion = '8.20' // 5.7 is default
  showViolations = false
}

pmd {
  consoleOutput = false
  ignoreFailures = true
  sourceSets = [sourceSets.main]
  reportsDir = file("$project.buildDir/reports/pmd")
  rulesMinimumPriority = 5
  ruleSets = [
    'category/java/bestpractices.xml',
    'category/java/codestyle.xml',
    'category/java/design.xml',
    'category/java/documentation.xml',
    'category/java/errorprone.xml',
    'category/java/multithreading.xml',
    'category/java/performance.xml',
    'category/java/security.xml'
  ]
  toolVersion = '6.55.0'
  incrementalAnalysis = true
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.compilerArgs = [
    '-Xlint:deprecation', // deprecation, rawtypes, cast, unchecked, all
    //'-Xdiags:verbose',
    //'-Werror'
  ]
}

compileJava.options.compilerArgs += '-proc:none'
compileTestJava.options.compilerArgs += '-proc:none'

javadoc {
  failOnError = false
}

test {
  useJUnitPlatform()
  /*
  useJUnitPlatform {
    includeTags 'fast', 'smoke & feature-a'
    //excludeTags 'slow', 'ci'
    includeEngines 'junit-jupiter'
    //excludeEngines 'junit-vintage'
  }
  */
}

//project.ext.short_version = '1.0.0'
