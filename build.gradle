plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

def env = System.getenv()
def tag = providers.environmentVariable('TAG')
version = tag.orElse("${mod_version}-development").get()
group = mod_group

base {
    archivesName = mod_archive_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    // JEI (optional integration; compile-time API only)
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Dev-only runtime dependencies: on the runtime classpath, but kept out of the published POM.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional equipment discovery; neither bundled nor a transitive runtime requirement.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    // Optional JEI integration: compiled against the API only, never bundled or required.
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    // Dev runs include JEI; pass -PwithoutJei to launch without it.
    if (!providers.gradleProperty('withoutJei').isPresent()) {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        configureEach {
            gameDirectory = file('run')
        }
        client {
            client()
            programArguments.addAll '--width', '2560', '--height', '1440'
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            systemProperty 'mmdlib.projectDir', project.layout.projectDirectory.asFile.absolutePath
            systemProperty 'mmdlib.python', providers.gradleProperty('mmdlibPython').getOrElse('python3')
            if (providers.gradleProperty('mmdlibMinecraftAssets').isPresent()) {
                systemProperty 'mmdlib.minecraftAssets', providers.gradleProperty('mmdlibMinecraftAssets').get()
            }
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main.resources.srcDir 'src/generated/resources'
    main.resources.exclude '.cache/**'
}

tasks.named('processResources', ProcessResources) {
    def properties = [
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            jei_version_range: jei_version_range,
            curios_version_range: curios_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: project.version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            display_url: display_url,
            issue_url: issue_url,
            update_url: update_url
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.withType(Jar).configureEach {
    manifest.attributes('Implementation-Version': project.version.toString())
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = mod_archive_name
            from components.java
        }
    }
    repositories {
        if (env.MAVEN_UPLOAD_URL) {
            maven {
                url = uri(env.MAVEN_UPLOAD_URL)
                credentials {
                    username = env.MAVEN_UPLOAD_USERNAME
                    password = env.MAVEN_UPLOAD_PASSWORD
                }
            }
        }
        // Local inspection: `./gradlew publishAllPublicationsToLocalRepository` writes to mcmodsrepo/.
        maven {
            name = 'local'
            url = layout.projectDirectory.dir('mcmodsrepo')
        }
    }
}

// runData launches from main output, so processResources necessarily precedes it.
// Refresh that output after generation for combined invocations such as runData build.
def refreshDataResources = tasks.register('refreshDataResources', Sync) {
    from sourceSets.main.resources
    into tasks.named('processResources').map { it.destinationDir }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.named('runData') { finalizedBy refreshDataResources }
tasks.configureEach { task ->
    if (task.name in ['jar', 'sourcesJar', 'javadoc', 'compileTestJava', 'compileRuntimeTestJava',
                    'runClient', 'runServer', 'runGameTestServer']
            || task.name.startsWith('verify') || task.name.startsWith('test')) {
        task.mustRunAfter(refreshDataResources)
    }
}

// Verification tasks (verify*, tests); run with `./gradlew check`.
apply from: 'gradle/verification.gradle'

// Runtime GUI smoke tests compile optional JEI hooks without requiring JEI at runtime.
configurations.named('runtimeTestCompileOnly') {
    extendsFrom configurations.compileOnly
}

// Optional playable examples, packaged separately from MMDLib.
apply from: 'scripts/companion.gradle'

// Javadoc for extenders and maintainers: `./gradlew javadoc` (output in build/docs/javadoc).
// Records and fluent builders are described in prose, so per-parameter tags are not required.
tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    options.links('https://docs.oracle.com/en/java/javase/21/docs/api/')
}

// Formatting: `./gradlew format` applies Google Java Style with google-java-format, then splits
// imports into blank-line-separated groups (scripts/group_imports.py). The formatter jar is not
// committed: put google-java-format's all-deps jar at tools/gjf.jar (or pass -PgjfJar=<path>).
tasks.register('format') {
    group = 'formatting'
    description = 'Formats all Java sources (Google style, grouped imports).'
    def jar = file(providers.gradleProperty('gjfJar').getOrElse('tools/gjf.jar'))
    def python = providers.gradleProperty('mmdlibPython').getOrElse('python3')
    def sources = fileTree('src') { include '**/*.java' }
    def java = "${System.getProperty('java.home')}/bin/java"
    doLast {
        if (!jar.isFile())
            throw new GradleException("google-java-format not found at ${jar}; see build.gradle")
        // Imports are left in place here and grouped by the script below instead.
        providers.exec {
            commandLine([java, '-jar', jar.absolutePath, '--skip-sorting-imports', '--replace'] +
                    sources.files.collect { it.absolutePath })
        }.result.get()
        def grouping = providers.exec {
            commandLine python, file('scripts/group_imports.py').absolutePath, file('src').absolutePath
        }
        grouping.result.get()
        logger.lifecycle("Formatted ${sources.files.size()} files. " + grouping.standardOutput.asText.get().trim())
    }
}

idea {
    module {
        downloadSources = true
    }
}

eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}
