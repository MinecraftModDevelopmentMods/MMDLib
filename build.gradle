plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}
version = '2.0.0-alpha'
group = 'zone.moddev.mc.lib'
base { archivesName = 'mmdlib' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    // JEI (optional integration; compile-time API only)
    maven { url = 'https://maven.blamejared.com' }
}
dependencies {
    implementation 'net.neoforged:neoforge:21.1.247'
    implementation 'com.schibsted.spt.data:jslt:0.1.14'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4.2'
    jarJar 'com.schibsted.spt.data:jslt:0.1.14'
    jarJar 'com.fasterxml.jackson.core:jackson-databind:2.13.4.2'
    jarJar 'com.fasterxml.jackson.core:jackson-core:2.13.4'
    jarJar 'com.fasterxml.jackson.core:jackson-annotations:2.13.4'
    // Optional JEI integration: compiled against the API only, never bundled or required.
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    // Dev runs include JEI; pass -PwithoutJei to launch without it.
    if (!providers.gradleProperty('withoutJei').isPresent()) {
        runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    }
}
runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run')
        modSource project.sourceSets.main
    }
    client {}
    server { argument '--nogui' }
    data {
        systemProperty 'mmdlib.projectDir', project.layout.projectDirectory.asFile.absolutePath
        systemProperty 'mmdlib.python', providers.gradleProperty('mmdlibPython').getOrElse('python3')
        if (providers.gradleProperty('mmdlibMinecraftAssets').isPresent()) {
            systemProperty 'mmdlib.minecraftAssets', providers.gradleProperty('mmdlibMinecraftAssets').get()
        }
        arguments.addAll '--mod', 'mmdlib', '--all', '--output',
                file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
    }
}
sourceSets {
    main.resources.srcDir 'src/generated/resources'
    main.resources.exclude '.cache/**'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
    repositories { maven { url = layout.projectDirectory.dir('mcmodsrepo') } }
}

tasks.withType(Jar).configureEach {
    manifest.attributes('Implementation-Version': project.version.toString())
}

// runData launches from main output, so processResources necessarily precedes it.
// Refresh that output after generation for combined invocations such as runData build.
def refreshDataResources = tasks.register('refreshDataResources', Sync) {
    from sourceSets.main.resources
    into tasks.named('processResources').map { it.destinationDir }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.configureEach { task ->
    if (task.name == 'runData') task.finalizedBy(refreshDataResources)
    if (task.name == 'jar' || task.name == 'jarJar' || task.name.startsWith('verify')
            || task.name.startsWith('test')
            || task.name in ['compileTestJava', 'compileBuilderTestJava', 'compileRuntimeTestJava',
                    'writeMinecraftClasspathJunit', 'writeMinecraftClasspathClient', 'writeMinecraftClasspathServer',
                    'runClient', 'runServer']) {
        task.mustRunAfter(refreshDataResources)
    }
}

// Verification tasks (verify*, test source sets); run with `./gradlew check`.
apply from: 'gradle/verification.gradle'
