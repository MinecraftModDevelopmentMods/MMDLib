plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.diffplug.spotless' version '8.9.0'
}

// Import-block step for Spotless and its fixture tests (docs/code-format.md).
apply from: 'gradle/import-blocks.gradle'
apply from: 'gradle/line-limit.gradle'

def env = System.getenv()
def tag = providers.environmentVariable('TAG')
def localMavenRepo = providers.gradleProperty('mmdlibLocalRepo').filter { !it.isBlank() }
def useLocalMaven = providers.gradleProperty('mmdlibUseLocal').map { it.toBoolean() }
        .getOrElse(true) && localMavenRepo.isPresent()
def developmentVersion = useLocalMaven
        ? providers.gradleProperty('mmdlibLocalVersion').getOrElse("${mod_version}-development")
        : "${mod_version}-development"
// Release tags always win over machine-local development settings.
version = tag.orElse(developmentVersion).get()
group = mod_group

base {
    archivesName = mod_archive_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    // JEI and CraftTweaker (optional integrations)
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Dev-only runtime dependencies: on the runtime classpath, but kept out of the published POM.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    // CraftTweaker for dev runs, in its own configuration so the machine (companion) and GUI smoke
    // runs can leave it out: they don't test it, and it slows their clients' world loading.
    craftTweakerDevRuntime
    localRuntime.extendsFrom craftTweakerDevRuntime
    // CraftTweaker's processor path brings slf4j-api 1.8 betas, whose ServiceLoader lookup finds
    // Gradle's own provider from another classloader and fails; 1.7.x binds statically instead.
    annotationProcessor {
        resolutionStrategy.force 'org.slf4j:slf4j-api:1.7.36'
    }
}

dependencies {
    // Optional equipment discovery; neither bundled nor a transitive runtime requirement.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    // Optional JEI integration: compiled against the API only, never bundled or required.
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    // Dev runs include JEI; pass -PwithoutJei to launch without it.
    if (!providers.gradleProperty('withoutJei').isPresent()) {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    }
    // Optional CraftTweaker integration: compiled against, never bundled or required.
    compileOnly "com.blamejared.crafttweaker:CraftTweaker-neoforge-1.21.1:${crafttweaker_version}"
    // Validates @ZenRegister/@ZenCodeType usage at compile time; needs CraftTweaker on its path too.
    annotationProcessor "com.blamejared.crafttweaker:Crafttweaker_Annotation_Processors:${crafttweaker_ap_version}"
    annotationProcessor "com.blamejared.crafttweaker:CraftTweaker-neoforge-1.21.1:${crafttweaker_version}"
    // Dev runs include CraftTweaker; pass -PwithoutCraftTweaker to launch without it.
    if (!providers.gradleProperty('withoutCraftTweaker').isPresent()) {
        craftTweakerDevRuntime "com.blamejared.crafttweaker:CraftTweaker-neoforge-1.21.1:${crafttweaker_version}"
    }
}

// CraftTweaker script API docs: the annotation processor writes pages for every
// @Document-annotated script type to build/crafttweaker-docs, in the CraftTweaker
// docs wiki's format (see docs/crafttweaker.md, "Generated API docs").
def craftTweakerDocs = layout.buildDirectory.dir('crafttweaker-docs')
tasks.named('compileJava', JavaCompile) {
    options.compilerArgs.add(craftTweakerDocs.map {
        "-Acrafttweaker.processor.document.output_directory=${it.asFile}"
    }.get())
    outputs.dir(craftTweakerDocs).withPropertyName('craftTweakerDocs')
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        configureEach {
            gameDirectory = file('run')
            // Optional user-level preferences apply only to manual development clients.
            if (name in ['client', 'companionClient']) {
                if (providers.gradleProperty('mmdlibClientWidth').isPresent())
                    programArguments.addAll '--width', providers.gradleProperty('mmdlibClientWidth').get()
                if (providers.gradleProperty('mmdlibClientHeight').isPresent())
                    programArguments.addAll '--height', providers.gradleProperty('mmdlibClientHeight').get()
            }
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main.resources.srcDir 'src/generated/resources'
    main.resources.exclude '.cache/**'
}

tasks.named('processResources', ProcessResources) {
    def properties = [
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            jei_version_range: jei_version_range,
            crafttweaker_version_range: crafttweaker_version_range,
            curios_version_range: curios_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: project.version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            display_url: display_url,
            issue_url: issue_url,
            update_url: update_url
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.withType(Jar).configureEach {
    manifest.attributes('Implementation-Version': project.version.toString())
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = mod_archive_name
            from components.java
        }
    }
    repositories {
        if (env.MAVEN_UPLOAD_URL) {
            maven {
                url = uri(env.MAVEN_UPLOAD_URL)
                credentials {
                    username = env.MAVEN_UPLOAD_USERNAME
                    password = env.MAVEN_UPLOAD_PASSWORD
                }
            }
        }
        // Shared dev repository from ~/.gradle/gradle.properties; defaults to mcmodsrepo/.
        // Publish only locally with: ./gradlew publishAllPublicationsToLocalRepository
        maven {
            name = 'local'
            url = useLocalMaven ? uri(localMavenRepo.get()) : layout.projectDirectory.dir('mcmodsrepo')
        }
    }
}

// runData launches from main output, so processResources necessarily precedes it.
// Refresh that output after generation for combined invocations such as runData build.
def refreshDataResources = tasks.register('refreshDataResources', Sync) {
    from sourceSets.main.resources
    into tasks.named('processResources').map { it.destinationDir }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.named('runData') { finalizedBy refreshDataResources }
tasks.configureEach { task ->
    if (task.name in ['jar', 'sourcesJar', 'javadoc', 'compileTestJava', 'compileRuntimeTestJava',
                    'runClient', 'runServer', 'runGameTestServer']
            || task.name.startsWith('verify') || task.name.startsWith('test')) {
        task.mustRunAfter(refreshDataResources)
    }
}

// Verification tasks (verify*, tests); run with `./gradlew check`.
apply from: 'gradle/verification.gradle'

// Runtime GUI smoke tests compile optional JEI hooks without requiring JEI at runtime.
configurations.named('runtimeTestCompileOnly') {
    extendsFrom configurations.compileOnly
}

// Optional playable examples, packaged separately from MMDLib.
apply from: 'scripts/companion.gradle'

// Javadoc for extenders and maintainers: `./gradlew javadoc` (output in build/docs/javadoc).
// Records and fluent builders are described in prose, so per-parameter tags are not required.
tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    // The CraftTweaker script API is documented for CraftTweaker's wiki instead (its Javadoc
    // holds script examples, such as <item:...> brackets); see docs/crafttweaker.md.
    exclude 'zone/moddev/mc/lib/compat/CraftTweaker/**'
    options.links('https://docs.oracle.com/en/java/javase/21/docs/api/')
}

// Formatting (docs/code-format.md): Eclipse JDT with the shared profile in
// gradle/java-formatter.xml (VS Code uses the same one), then the import-block step. Lines the
// formatter can't wrap below 80 may run to 120; `lineLimit` (gradle/line-limit.gradle) warns past
// that, without failing.
// Ratcheted: only files changed since the base branch are checked and formatted, so code is
// brought over to this style as it is next edited. Never reformat unrelated files in a change.
// spotlessCheck is part of check/build; `./gradlew spotlessApply` (or `format`) fixes files.
// `-PformatAll` drops the ratchet, so the whole tree is checked or formatted: use it once after
// changing the style, in its own commit (listed in .git-blame-ignore-revs).
spotless {
    if (!providers.gradleProperty('formatAll').isPresent()) {
        ratchetFrom 'origin/master-2.0-1.21.1-neo'
    }
    java {
        target 'src/**/*.java'
        eclipse('4.35')
            // Use the same Eclipse distribution through its FAU mirror; the primary P2
            // host times out on CI even when Maven dependencies resolve successfully.
            .withP2Mirrors(['https://download.eclipse.org/': 'https://ftp.fau.de/eclipse/'])
            .configFile('gradle/java-formatter.xml')
        custom 'importBlocks', importBlocksStep
    }
}

tasks.register('format') {
    group = 'formatting'
    description = 'Formats changed Java sources; an alias for spotlessApply.'
    dependsOn 'spotlessApply'
}

idea {
    module {
        downloadSources = true
    }
}

eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}
