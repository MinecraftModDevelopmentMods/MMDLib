// Verification: the JUnit tests, the runtimeTest source set and every verify* task.
// All of it runs on `./gradlew check`; `build` only compiles and packages (see the end of this file).

sourceSets {
    runtimeTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.test.runtimeClasspath
    }
}
tasks.named('check') { dependsOn tasks.named('compileRuntimeTestJava') }

// Server game tests in src/runtimeTest (MMDLibGameTests): `./gradlew runGameTestServer`, part of
// `check`. The run loads main and runtimeTest as one mod, in a fresh world each time, and exits
// with the number of failed tests. Release jars never contain runtimeTest (verifyReleaseClasses).
def gameTestDir = layout.buildDirectory.dir('gametest')
runs {
    gameTestServer {
        workingDirectory gameTestDir
        modSource project.sourceSets.runtimeTest
        systemProperty 'neoforge.enabledGameTestNamespaces', 'mmdlib'
    }
}
// NeoGradle creates the run task late, so it is found by name.
def gameTestTask = tasks.matching { it.name == 'runGameTestServer' }
gameTestTask.configureEach { it.doFirst { project.delete(gameTestDir); gameTestDir.get().asFile.mkdirs() } }
tasks.named('check') { dependsOn gameTestTask }

// Unit tests in src/test: JUnit 5, no running game. `./gradlew test` (part of `check`).
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
    // VanillaExamplesTest and RuntimeBehaviorTest read the shipped definitions from disk.
    systemProperty 'mmdlib.resources', file('src/main/resources').absolutePath
    systemProperty 'mmdlib.generated', file('src/generated/resources').absolutePath
}

def verifyReleaseClasses = tasks.register('verifyReleaseClasses') {
    group = 'verification'
    dependsOn tasks.named('jar')
    doLast {
        new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { archive ->
            def testOnly = ['zone/moddev/mc/lib/smoke/', 'data/mmdlib_smoke/', 'data/mmdlib/structure/empty.nbt']
            def leaked = archive.entries().findAll { entry -> testOnly.any { entry.name.startsWith(it) } }
            if (!leaked.isEmpty()) throw new GradleException('Test classes and data must not be packaged: ' + leaked.collect { it.name })
        }
    }
}
tasks.named('check') { dependsOn verifyReleaseClasses }

// The machine module's core stays loader-neutral: only machine/neoforge may import NeoForge.
def verifyMachineImports = tasks.register('verifyMachineImports') {
    group = 'verification'
    def root = file('src/main/java/zone/moddev/mc/lib/machine')
    def sources = fileTree(root) { include '**/*.java'; exclude 'neoforge/**' }
    inputs.files(sources)
    doLast {
        def leaked = sources.files.findAll { it.text =~ /(?m)^import\s+(static\s+)?net\.neoforged\./ }
        if (!leaked.isEmpty())
            throw new GradleException('Machine core files import NeoForge: ' + leaked.collect { root.relativePath(it) })
    }
}
tasks.named('check') { dependsOn verifyMachineImports }

def verifyStaticAssets = tasks.register('verifyStaticAssets', Exec) {
    group = 'verification'
    dependsOn tasks.named('classes')
    commandLine providers.gradleProperty('mmdlibPython').getOrElse('python3'), file('scripts/validate_static_assets.py').absolutePath
}
tasks.named('check') { dependsOn verifyStaticAssets }

// Gradle's `build` normally runs `check`. Detach it so a build stays fast; run `./gradlew check`
// (or `./gradlew build check`) to verify.
tasks.named('build') {
    setDependsOn(dependsOn.findAll { dep ->
        !(dep == 'check' || (dep instanceof Task && dep.name == 'check') || (dep instanceof TaskProvider && dep.name == 'check'))
    })
}
