# Project
# Version string only used in dev, however when making a tag on github it should be like major.minor.bug.mc+loader
# Example: 2.0.0.121012 -> 2.0.0, then 1 21 01 for Minecraft 1.21.1, then 2 for NeoForge (1 is Forge).
mod_version = 2.0.0.121012
mod_name = MMDLib
mod_id = mmdlib
mod_archive_name = mmdlib
mod_description = This mod provides a complete JSON-based configuration system and a means for mods to provide JSON-based descriptions of blocks and items to be loaded and registered. Hopefully, at some point, it will also include the ability to handle Tile/Block Entities and a lot of other special bits as well.
mod_group = zone.moddev.mc.lib
mod_authors = Cyanobacterium (Dr. Cyano), jriwanek, Mistress Curle, DShadowWolf, Gigaherz
mod_license = LGPL-2.1-only
# CurseForge project ID for release uploads; leave blank to skip CurseForge publishing.
curseforge_id =
display_url = https://github.com/MinecraftModDevelopmentMods/MMDLib
update_url = https://raw.githubusercontent.com/MinecraftModDevelopmentMods/MMDLib/refs/heads/master-2.0-1.21.1-neo/update.json
issue_url = https://github.com/MinecraftModDevelopmentMods/MMDLib/issues

# Dependencies
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.21.2)
neoforge_version = 21.1.247
neoforge_version_range = [21.1.247,21.2)
loader_version_range = [3,)

# Parchment (parameter names + javadocs on top of Mojang mappings)
# Versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version = 1.21.1
parchment_mappings_version = 2024.11.17

# Optional JEI integration (compile-time API; dev runtime only)
jei_version = 19.57.0.451
jei_version_range = [19,)

# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.configuration-cache = false
org.gradle.caching = true
org.gradle.parallel = false
