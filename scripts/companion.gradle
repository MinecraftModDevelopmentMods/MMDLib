// The companion's machine runs don't test CraftTweaker (the library's game tests do), so they run
// without it and its ZenCode libraries.
def mainRuntimeWithoutCraftTweaker = sourceSets.main.runtimeClasspath.minus(configurations.craftTweakerDevRuntime)

sourceSets {
    companion {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + mainRuntimeWithoutCraftTweaker
    }
    companionTest {
        compileClasspath += sourceSets.companion.output + sourceSets.companion.compileClasspath
        runtimeClasspath += sourceSets.companion.output + sourceSets.companion.runtimeClasspath
    }
    // Mock GameTest connections cannot negotiate Curios/Jade login-sync payloads.
    // Reuse the compiled fixtures, but keep optional mods for real client/server smoke runs.
    companionServerTest {
        runtimeClasspath += sourceSets.companionTest.output + sourceSets.companion.output + sourceSets.main.output + mainRuntimeWithoutCraftTweaker
    }
}

neoForge.addModdingDependenciesTo(sourceSets.companion)
neoForge.addModdingDependenciesTo(sourceSets.companionTest)
neoForge.addModdingDependenciesTo(sourceSets.companionServerTest)

// Jade is present in playable companion and real-client smoke runs, including their integrated server.
// Keep mock GameTest connections isolated, as with Curios below; publish neither runtime fixture.
dependencies {
    companionRuntimeOnly "maven.modrinth:jade:${jade_version}"
}

// Development fixtures only: do not add backpack APIs or required mod metadata to either jar.
// -PwithoutBackpacks retains a companion run without Curios or backpack mods.
if (!providers.gradleProperty('withoutBackpacks').isPresent()) {
    dependencies {
        companionRuntimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
        companionRuntimeOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
        companionRuntimeOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    }
}

neoForge {
    mods {
        mmdlib_companion {
            sourceSet sourceSets.companion
        }
        mmdlib_companion_test {
            sourceSet sourceSets.companion
            sourceSet sourceSets.companionTest
        }
    }
    runs {
        companionClient {
            client()
            gameDirectory = layout.projectDirectory.dir('run/companion')
            sourceSet = sourceSets.companion
            loadedMods = [neoForge.mods.named(mod_id).get(), neoForge.mods.mmdlib_companion]
        }
        companionClientSmoke {
            client()
            gameDirectory = layout.buildDirectory.dir('companion-client-smoke')
            sourceSet = sourceSets.companionTest
            loadedMods = [neoForge.mods.named(mod_id).get(), neoForge.mods.mmdlib_companion_test]
            systemProperty 'mmdlib.companionSmoke', 'true'
            if (project.hasProperty('redstoneConnectionSmokeOnly'))
                systemProperty 'mmdlib.redstoneConnectionSmokeOnly', 'true'
            if (project.hasProperty('processorButtonSmokeOnly'))
                systemProperty 'mmdlib.processorButtonSmokeOnly', 'true'
            if (project.hasProperty('rendererSmokeOnly'))
                systemProperty 'mmdlib.rendererSmokeOnly', 'true'
            if (project.hasProperty('inheritanceSmokeOnly'))
                systemProperty 'mmdlib.inheritanceSmokeOnly', 'true'
            if (project.hasProperty('behaviorSmokeOnly'))
                systemProperty 'mmdlib.behaviorSmokeOnly', 'true'
            if (project.hasProperty('groupPresentationSmokeOnly'))
                systemProperty 'mmdlib.groupPresentationSmokeOnly', 'true'
            if (project.hasProperty('valueTypeSmokeOnly'))
                systemProperty 'mmdlib.valueTypeSmokeOnly', 'true'
            if (project.hasProperty('tooltipSmokeOnly'))
                systemProperty 'mmdlib.tooltipSmokeOnly', 'true'
            if (project.hasProperty('statsSmokeOnly'))
                systemProperty 'mmdlib.statsSmokeOnly', 'true'
            if (project.hasProperty('popoutSmokeOnly'))
                systemProperty 'mmdlib.popoutSmokeOnly', 'true'
            if (project.hasProperty('drawerSmokeOnly'))
                systemProperty 'mmdlib.drawerSmokeOnly', 'true'
            if (project.hasProperty('reservationSmokeOnly'))
                systemProperty 'mmdlib.reservationSmokeOnly', 'true'
            if (project.hasProperty('filterSmokeOnly'))
                systemProperty 'mmdlib.filterSmokeOnly', 'true'
            programArguments.addAll '--width', '1280', '--height', '960'
        }
        companionGameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('companion-gametest')
            sourceSet = sourceSets.companionServerTest
            loadedMods = [neoForge.mods.named(mod_id).get(), neoForge.mods.mmdlib_companion_test]
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mmdlib_companion'
        }
        multiblockClientSmoke {
            client()
            gameDirectory = layout.buildDirectory.dir('multiblock-client-smoke')
            sourceSet = sourceSets.companionTest
            loadedMods = [neoForge.mods.named(mod_id).get(), neoForge.mods.mmdlib_companion_test]
            systemProperty 'mmdlib.multiblockSmoke', 'true'
            programArguments.addAll '--width', '1280', '--height', '960'
        }
        simpleCrusherClientSmoke {
            client()
            gameDirectory = layout.buildDirectory.dir('simple-crusher-client-smoke')
            sourceSet = sourceSets.companionTest
            loadedMods = [neoForge.mods.named(mod_id).get(), neoForge.mods.mmdlib_companion_test]
            systemProperty 'mmdlib.simpleCrusherSmoke', 'true'
            programArguments.addAll '--width', '1280', '--height', '960'
        }
        simpleLavaFurnaceClientSmoke {
            client()
            gameDirectory = layout.buildDirectory.dir('simple-lava-furnace-client-smoke')
            sourceSet = sourceSets.companionTest
            loadedMods = [neoForge.mods.named(mod_id).get(), neoForge.mods.mmdlib_companion_test]
            systemProperty 'mmdlib.simpleLavaFurnaceSmoke', 'true'
            programArguments.addAll '--width', '1280', '--height', '960'
        }
    }
}

tasks.matching { it.name == 'runSimpleCrusherClientSmoke' }.configureEach {
    doFirst {
        def smokeDir = layout.buildDirectory.dir('simple-crusher-client-smoke').get().asFile
        smokeDir.mkdirs()
        new File(smokeDir, 'options.txt').text = 'guiScale:2\nmaxFps:30\nonboardAccessibility:false\npauseOnLostFocus:false\n'
    }
    doLast {
        def log = layout.buildDirectory.file('simple-crusher-client-smoke/logs/latest.log').get().asFile
        if (!log.exists() || !log.text.contains('SIMPLE_CRUSHER_CLIENT_PASS') || log.text.contains('SIMPLE_CRUSHER_CLIENT_FAIL'))
            throw new GradleException('SimpleCrusher client smoke failed; inspect ' + log)
    }
}

