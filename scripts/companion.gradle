tasks.register('verifyCompanionPackaging') {
    group = 'verification'
    dependsOn tasks.named('jar'), companionJar
    doLast {
        def libraryDir = tasks.named('jar').get().destinationDirectory.get().asFile.toPath().toAbsolutePath().normalize()
        def companionFile = companionJar.get().archiveFile.get().asFile
        if (companionFile.toPath().toAbsolutePath().normalize().startsWith(libraryDir))
            throw new GradleException('Companion jar must stay outside the library release directory: ' + companionFile)
        def staleCompanions = fileTree(libraryDir.toFile()) { include 'mmdlib-companion-*.jar' }.files
        if (!staleCompanions.isEmpty())
            throw new GradleException('Companion jars in the library release directory; run clean before building: ' + staleCompanions)
        if (publishing.publications.named('mavenJava').get().artifacts.any { it.file == companionFile })
            throw new GradleException('Companion jar must not be part of the MMDLib Maven publication')
        new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { jar ->
            def leaked = jar.entries().findAll { it.name.contains('mmdlib_companion') || it.name.startsWith('zone/moddev/mc/companion/') }
            if (leaked) throw new GradleException('Companion content in MMDLib jar: ' + leaked*.name)
            def bundledIntegrations = jar.entries().findAll { it.name.startsWith('top/theillusivec4/') || it.name.startsWith('net/p3pp3rf1y/') }
            if (bundledIntegrations) throw new GradleException('Optional integration classes bundled in MMDLib: ' + bundledIntegrations*.name)
            def metadata = jar.getInputStream(jar.getEntry('META-INF/neoforge.mods.toml')).getText('UTF-8')
            if (!(metadata =~ /(?s)modId="curios"\s+type="optional"/).find())
                throw new GradleException('Curios must be declared optional in the release jar')
            if (metadata.contains('sophisticatedbackpacks') || metadata.contains('sophisticatedcore'))
                throw new GradleException('Backpack test fixtures must not be dependencies of MMDLib')
        }
        new java.util.zip.ZipFile(companionJar.get().archiveFile.get().asFile).withCloseable { jar ->
            def leaked = jar.entries().findAll { it.name.startsWith('zone/moddev/mc/lib/') || it.name.startsWith('zone/moddev/mc/companion/test/') || it.name.contains('/structure/') }
            if (leaked) throw new GradleException('Library or test content in companion jar: ' + leaked*.name)
            if (jar.getEntry('META-INF/neoforge.mods.toml') == null)
                throw new GradleException('Companion mod descriptor is missing')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyCompanionPackaging') }
