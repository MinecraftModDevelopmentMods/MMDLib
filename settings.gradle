pluginManagement {
  repositories {
    gradlePluginPortal()
    maven {
      name = 'MinecraftForge'
      url = 'https://maven.minecraftforge.net/'
    }
  }
  plugins {
    id 'net.minecraftforge.gradle' version fg_version
  }
}

plugins {
  id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = archivesBaseName
